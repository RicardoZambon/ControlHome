name: Release

# Builds the multi-arch image (linux/amd64 + linux/arm64) from deploy/Dockerfile and pushes it to GHCR:
#   push to main -> edge + sha-<short>
#   tag vX.Y.Z   -> X.Y.Z + X.Y (+ latest) + sha-<short>
# with an SBOM and max-mode provenance from BuildKit, plus a GitHub build-provenance attestation of the pushed digest.
on:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default; the image job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ricardozambon/controlhome

jobs:
  image:
    name: Build, push and attest the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU: the build stages run on the runner's platform and `dotnet publish -a $TARGETARCH` cross-compiles.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=ControlHome
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A tag v0.1.0 builds version 0.1.0; main builds <VersionPrefix>-edge.<run number>.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
            VERSION_SUFFIX=${{ !startsWith(github.ref, 'refs/tags/v') && format('edge.{0}', github.run_number) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ricardozambon/controlhome
          subject-digest: ${{ steps.build.outputs.digest }}

      # The image must be pullable without credentials (Umbrel and other hosts pull anonymously). A new GHCR package
      # starts private: if this warns, make the package public in its package settings.
      - name: Verify anonymous pull
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          if ! docker pull "${IMAGE}@${DIGEST}"; then
            echo "::warning title=Anonymous pull failed::${IMAGE}@${DIGEST} cannot be pulled without credentials. Make the GHCR package public (Package settings > Change visibility)."
            exit 1
          fi
