name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job; jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -warnaserror -c Release

      - name: Test (unit + architecture + integration)
        run: dotnet test --no-build -c Release

  frontend:
    name: Frontend (lint, typecheck, test, colors, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from web/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Raw color check (tokens.css is the only color source)
        run: npm run check:colors

      - name: Build
        run: npm run build

  api-client-drift:
    name: API client drift (committed OpenAPI document and generated client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node (version from web/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the API (regenerates web/packages/api-client/openapi.json)
        run: dotnet build src/ControlHome.Api -c Release

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Regenerate the API client
        working-directory: web
        run: npm run gen:api

      - name: Fail on drift (rebuild the API, run `npm run gen:api` in web/ and commit the result)
        run: |
          git diff --exit-code -- web/packages/api-client
          untracked="$(git ls-files --others --exclude-standard -- web/packages/api-client)"
          if [ -n "$untracked" ]; then
            echo "Generated files are not committed:"
            echo "$untracked"
            exit 1
          fi

  e2e:
    name: E2E (Playwright against the compose stack, database started late)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Local image build, bridge network on :8080, bundled SQL Server, Testing environment + fixed setup code.
      COMPOSE_ARGS: >-
        -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml -f deploy/docker-compose.e2e.yml
        --profile bundled-db
      E2E_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from web/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Write deploy/.env (SA password generated for this run)
        run: |
          # Upper case and '-' from the prefix, lower case and digits from the hex: SQL Server's complexity rules.
          sa_password="Ce2e-$(openssl rand -hex 24)"
          echo "::add-mask::$sa_password"
          umask 077
          {
            echo "MSSQL_SA_PASSWORD=$sa_password"
            echo "CONTROLHOME_DB_CONNECTION=Server=mssql,1433;Database=ControlHome_Compose;User ID=sa;Password=$sa_password;TrustServerCertificate=True"
          } > deploy/.env

      - name: Start the app without its database
        run: docker compose $COMPOSE_ARGS up -d --build controlhome

      - name: Let it run without the database for a while
        run: |
          sleep 20
          echo "health/ready while the database is down: $(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/health/ready")"
          curl -fsS "$E2E_BASE_URL/api/setup/status"

      - name: Start the database (late)
        run: docker compose $COMPOSE_ARGS up -d mssql

      - name: Wait for /health/ready (up to 5 minutes)
        run: |
          for attempt in $(seq 1 150); do
            if curl -fsS -o /dev/null "$E2E_BASE_URL/health/ready"; then
              echo "Ready after about $((attempt * 2)) s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::$E2E_BASE_URL/health/ready did not answer 200 within 5 minutes."
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium (with system dependencies)
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E specs
        id: e2e
        working-directory: web
        run: npm run e2e

      - name: Screenshots
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        working-directory: web
        run: npm run screenshots

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: web/tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # Second phase: pre-database setup mode. A fresh stack (volumes removed) whose app has NO connection string; the
      # setup wizard's database step connects it. The app (not the browser) reaches SQL Server, so the wizard gets the
      # address the app container resolves: the compose service mssql.
      - name: "Pre-database setup: restart without a connection string"
        run: |
          docker compose $COMPOSE_ARGS down --volumes --remove-orphans
          sed -i '/^CONTROLHOME_DB_CONNECTION=/d' deploy/.env
          docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 300 mssql controlhome

      - name: "Pre-database setup: wait for /health/live and check that no database is configured"
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "$E2E_BASE_URL/health/live"; then break; fi
            sleep 2
          done
          status="$(curl -fsS "$E2E_BASE_URL/api/setup/status")"
          echo "$status"
          echo "$status" | grep -q '"databaseConfigured":false'

      - name: "Pre-database setup: E2E spec"
        id: e2e-predb
        working-directory: web
        env:
          E2E_DB_HOST: mssql
          E2E_DB_PORT: "1433"
          E2E_DB_USER: sa
          E2E_DB_NAME: ControlHome_PreDb
        run: |
          E2E_DB_PASSWORD="$(grep '^MSSQL_SA_PASSWORD=' ../deploy/.env | cut -d= -f2-)"
          export E2E_DB_PASSWORD
          npm run e2e -- db-setup.spec.ts --project desktop

      - name: "Pre-database setup: upload the Playwright report"
        if: ${{ !cancelled() && (steps.e2e-predb.outcome == 'success' || steps.e2e-predb.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-predb
          path: web/tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compose logs
        if: failure()
        run: docker compose $COMPOSE_ARGS logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: |
          docker compose $COMPOSE_ARGS down --volumes --remove-orphans || true
          rm -f deploy/.env

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        # Same pinned image (tag + multi-arch index digest) as scripts/check-secrets.sh; rules in .gitleaks.toml.
        run: >-
          docker run --rm --network none -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner
