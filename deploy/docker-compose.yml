# ControlHome — production compose (a LAN Docker host, e.g. Umbrel).
#
#   cd deploy
#   cp .env.example .env              # then edit .env (never commit it)
#   mkdir -p data && sudo chown 1000:1000 data   # owned by CONTROLHOME_UID:CONTROLHOME_GID
#   docker compose up -d
#
# Optional bundled SQL Server 2025 Express (x64 hosts only; listens on 127.0.0.1:1433):
#   docker compose --profile bundled-db up -d
#
# Optional camera live view (go2rtc sidecar; set GO2RTC_API_USERNAME / GO2RTC_API_PASSWORD / CONTROLHOME_LAN_IP in .env):
#   docker compose --profile cameras up -d
#
# Without a connection string the app starts in pre-DB setup mode and asks for the database in the setup wizard.
# Development: docker-compose.dev.yml (local build, bridge network, published port 8080).

name: controlhome

services:
  controlhome:
    image: ghcr.io/ricardozambon/controlhome:${CONTROLHOME_VERSION:-edge}
    # Host networking: device discovery, Wake-on-LAN and device push events need the LAN (Umbrel's Home Assistant app
    # does the same). The app listens on CONTROLHOME_PORT on every host interface.
    network_mode: host
    user: "${CONTROLHOME_UID:-1000}:${CONTROLHOME_GID:-1000}"
    environment:
      ASPNETCORE_HTTP_PORTS: ${CONTROLHOME_PORT:-8711}
      ConnectionStrings__ControlHome: ${CONTROLHOME_DB_CONNECTION:-}
      Setup__Code: ${CONTROLHOME_SETUP_CODE:-}
      TZ: ${TZ:-Etc/UTC}
      # Camera live view through the go2rtc sidecar (profile cameras): off while the credentials are empty.
      Cameras__Go2Rtc__Url: http://127.0.0.1:${GO2RTC_API_PORT:-1984}
      Cameras__Go2Rtc__Username: ${GO2RTC_API_USERNAME:-}
      Cameras__Go2Rtc__Password: ${GO2RTC_API_PASSWORD:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "/app/ControlHome.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3

  go2rtc:
    profiles: [cameras]
    # alexxit/go2rtc 1.9.14 (multi-arch index digest).
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    # Host networking like the app: WebRTC media goes straight to browsers on the LAN (TCP/UDP 8555). The API listens on
    # 127.0.0.1 only, with random credentials and local_auth (go2rtc.yaml), so only ControlHome can use it.
    network_mode: host
    user: "${CONTROLHOME_UID:-1000}:${CONTROLHOME_GID:-1000}"
    environment:
      GO2RTC_API_LISTEN: 127.0.0.1:${GO2RTC_API_PORT:-1984}
      GO2RTC_API_USERNAME: ${GO2RTC_API_USERNAME:-}
      GO2RTC_API_PASSWORD: ${GO2RTC_API_PASSWORD:-}
      CONTROLHOME_LAN_IP: ${CONTROLHOME_LAN_IP:-}
    # Refuses to start without real credentials (go2rtc would otherwise accept the literal "${...}" placeholders).
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$GO2RTC_API_USERNAME" ] || [ "$${#GO2RTC_API_PASSWORD}" -lt 16 ]; then
          echo "go2rtc: set GO2RTC_API_USERNAME and a random GO2RTC_API_PASSWORD (16+ characters) in deploy/.env" >&2
          exit 1
        fi
        if [ -z "$$CONTROLHOME_LAN_IP" ]; then
          echo "go2rtc: CONTROLHOME_LAN_IP is not set; WebRTC may not reach browsers (MSE still works)" >&2
          # Unset, not empty: go2rtc.yaml's default applies instead of a candidate without an address (":8555").
          unset CONTROLHOME_LAN_IP
        fi
        exec go2rtc -config /config/go2rtc.yaml
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mssql:
    profiles: [bundled-db]
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    # Loopback only: reachable by the app (host network) and the host, never by the LAN.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      # The password comes from the container's environment ($$ escapes compose interpolation) via SQLCMDPASSWORD, so it
      # appears neither in this file's rendered config nor in the process list.
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 10

volumes:
  mssql-data:
