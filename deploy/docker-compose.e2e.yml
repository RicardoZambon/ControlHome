# ControlHome — end-to-end test override (Playwright), layered on docker-compose.yml + docker-compose.dev.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml --profile bundled-db up -d --build
#
# Testing environment: enables the /api/_test/* endpoints (never mapped in Production) and uses the fixed, non-secret
# setup code that the Playwright specs type into the setup wizard.

services:
  controlhome:
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      Setup__Code: E2E-SETUP-CODE-1
      # Every spec completes the setup and signs in again from the same address: lift the per-IP limits
      # (5 setups per 10 minutes, 10 sign-ins per minute).
      RateLimiting__Setup__PermitLimit: "10000"
      RateLimiting__Login__PermitLimit: "10000"
